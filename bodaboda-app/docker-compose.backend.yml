version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bodaboda-backend-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=docker
      - SECRET_KEY=bodaboda-secret-key-change-in-production
      - CORS_ORIGINS=*
    volumes:
      - ./backend:/app
    networks:
      - bodaboda-network
    restart: unless-stopped

networks:
  bodaboda-network:
    driver: bridge
