version: '3.8'

services:
  # Staging PostgreSQL
  postgres-staging:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bodaboda_staging_db
      POSTGRES_USER: bodaboda_staging
      POSTGRES_PASSWORD: staging_password123
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bodaboda-network

  # Staging Backend
  backend-staging:
    image: ghcr.io/kisingezainabu-cell/bodaboda-app:${GITHUB_REF}
    environment:
      - DATABASE_URL=postgresql://bodaboda_staging:staging_password123@postgres-staging:5432/bodaboda_staging_db
      - FLASK_ENV=staging
      - REDIS_URL=redis://redis-staging:6379/0
    depends_on:
      - postgres-staging
      - redis-staging
    ports:
      - "5001:5000"
    networks:
      - bodaboda-network

  # Staging Frontend
  frontend-staging:
    image: ghcr.io/kisingezainabu-cell/bodaboda-app:${GITHUB_REF}
    ports:
      - "82:80"
    depends_on:
      - backend-staging
    networks:
      - bodaboda-network

  # Staging Redis
  redis-staging:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - bodaboda-network

networks:
  bodaboda-network:
    driver: bridge
