services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=bodaboda_db
      - POSTGRES_USER=bodaboda
      - POSTGRES_PASSWORD=password123
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodaboda -d bodaboda_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bodaboda-network

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=bodaboda_db
      - DB_USER=bodaboda
      - DB_PASSWORD=password123
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
      - SECRET_KEY=django-insecure-bodaboda-app-key-123456789
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bodaboda-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - bodaboda-network

  mqtt:
    image: eclipse-mosquitto
    container_name: bodaboda-mqtt
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - bodaboda-network

volumes:
  postgres_data:

networks:
  bodaboda-network:
    external: true
